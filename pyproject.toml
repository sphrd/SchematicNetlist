[project]
name = "schematic-netlist"
version = "0.2.0"
description = "Read a schematic PDF (vector or scanned) into components, nets, an HSPICE netlist and an Excel analysis report."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["schematic", "netlist", "spice", "hspice", "pdf", "eda", "ocr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "pdfplumber>=0.11.0",
    "pypdfium2>=4.0",
    "Pillow>=9.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Reading scanned/image-only PDF pages (OpenCV + OCR). Also needs the Tesseract OCR engine,
# a separate system install (bundled into the Windows exe by src/build_exe.py).
image = [
    "opencv-python-headless>=4.8",
    "pytesseract>=0.3.10",
    "numpy>=1.24",
]
# Real OS drag-and-drop in the GUI. Without it the GUI still works via its "Browse..." button.
gui = [
    "tkinterdnd2>=0.4.2",
]
dev = [
    "pyinstaller>=6.0",
]

[project.scripts]
schematic-netlist = "schematic_netlist.cli:main"
schematic-netlist-gui = "schematic_netlist.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schematic_netlist"]
